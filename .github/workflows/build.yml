name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v1.0.${{ github.run_number }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore HypervisorToggle.csproj

    - name: Build Release
      run: dotnet build HypervisorToggle.csproj -c Release --no-restore

    - name: Publish Standalone Executable
      run: dotnet publish HypervisorToggle.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

    - name: Create distribution package
      run: |
        mkdir dist
        copy bin\Release\net8.0-windows\win-x64\publish\HypervisorToggle.exe dist\
        copy README.md dist\
        copy QUICKSTART.md dist\
        copy TROUBLESHOOTING.md dist\
        copy *.bat dist\
      shell: cmd

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HypervisorToggle-win-x64
        path: dist/

    - name: Create ZIP
      if: github.event_name != 'pull_request'
      run: |
        cd dist
        7z a ../HypervisorToggle-%RELEASE_TAG%.zip *
      shell: cmd

    - name: Create Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        files: HypervisorToggle-${{ env.RELEASE_TAG }}.zip
        body: |
          ## Hypervisor Mode Toggle ${{ env.RELEASE_TAG }}

          Toggle between Hyper-V and VMware Workstation modes on Windows, with full support for Windows 11 24H2 and nested virtualization (e.g., Proxmox VMs).

          ### Download
          - Download `HypervisorToggle-${{ env.RELEASE_TAG }}.zip` and extract all files
          - Run as Administrator:
            - **GUI:** `HypervisorToggle.exe` — full experience with state-aware restore
            - **Disable Hyper-V for VMware:** Right-click `disable-hyperv-manual.bat` → Run as administrator
            - **Re-enable Hyper-V:** Right-click `enable-hyperv-manual.bat` → Run as administrator
            - **Diagnose:** `check-status.bat`
          - Restart your computer after any change

          ### What's Included
          - `HypervisorToggle.exe` — GUI app (saves state before disabling, restores exact values on re-enable)
          - `disable-hyperv-manual.bat` — Disable all Hyper-V features for VMware
          - `enable-hyperv-manual.bat` — Re-enable Hyper-V (reverse operation)
          - `check-status.bat` — Diagnose current configuration
          - `README.md`, `QUICKSTART.md`, `TROUBLESHOOTING.md`

          ### Features
          - Disables ALL Hyper-V features for full VMware compatibility
          - Fixes nested virtualization (Proxmox VM vcpu-0 breakpoint error)
          - Windows 11 24H2 support: Memory Integrity, VBS, Windows Hello VBS, LSA Isolation
          - Full reverse operation: Enable Hyper-V Mode restores security settings to exact pre-disable values
          - State saved to hypervisor-state.json so re-enable respects what was already off
          - Full diagnostics tool included

          See QUICKSTART.md for usage instructions.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
